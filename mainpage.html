<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/all.min.css" />
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/dashboard.css" />
    <link rel="stylesheet" href="assets/css/mainpage.css" />
    <link rel="stylesheet" href="assets/css/responsive-fix.css" />
    <link rel="shortcut icon" href="assets/img/icon.svg" type="image/x-icon" />
  </head>
  <body>
    <div class="sidebar" id="sidebar">
      <div class="logo">
        <img src="assets/img/logo.svg" alt="Logo" id="logo" />
        <span>أكاديمية تعليمية</span>
      </div>
      <ul>
        <li>
          <a href="#"
            ><i class="fa-solid fa-house mx-2"></i> <span>الرئيسية</span></a
          >
        </li>
        <li>
          <a href="#"
            ><i class="fa-solid fa-book mx-2"></i> <span>المواد </span></a
          >
        </li>
        <li>
          <a href="#"
            ><i class="fa-solid fa-chart-line mx-2"></i>
            <span>التقارير</span></a
          >
        </li>
        <li>
          <a href="#"
            ><i class="fa-regular fa-money-bill-1 mx-2"></i>
            <span>الفواتير</span></a
          >
        </li>
        <li>
          <a href="#"
            ><i class="fa-solid fa-gear mx-2"></i> <span>الإعدادات</span></a
          >
        </li>
      </ul>
    </div>

    <!-- Overlay -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <button
      class="icon-btn d-lg-none"
      aria-label="فتح القائمة"
      onclick="toggleSidebar()"
    >
      <i class="fa-solid fa-bars"></i>
    </button>
    <!-- Main Content -->
    <div class="content">
      <div class="top-icons">
        <button class="icon-btn" aria-label="الإشعارات">
          <i class="fa-solid fa-bell"></i>
        </button>
        <button
          class="icon-btn"
          aria-label="الملف الشخصي"
          onclick="window.location.href='#'"
        >
          <i class="fa-solid fa-circle-user"></i>
        </button>
      </div>
      <div class="mainpage m-3" id="mainpage">
        <div class="container mt-3">
          <div
            class="HeadOfBody d-sm-flex flex-column flex-sm-row text-center text-sm-end gap-3"
          >
            <div class="img">
              <img src="assets/img/Avatar 3.svg" alt="" />
            </div>
            <div class="text">
              <h2>عيد العظيم عبد الناصر عبد العظيم</h2>
              <p>الصف الثاني الثانوي</p>
            </div>
          </div>
          <div class="progres">
            <div class="overall-prog">
              <div class="text"><p>المستوي الكلي</p></div>
              <div id="semiContainer"></div>
            </div>
            <div class="deteils-prog d-md-flex justify-content-between">
              <div class="exams col-md-5">
                <div class="text"><p>الامتحان</p></div>
                <div id="semiContainerEXAM"></div>
              </div>
              <div class="tasks col-md-5">
                <div class="text"><p>الواجبات</p></div>
                <div id="semiContainerTASK"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="assets/js/progressbar.js"></script>
    <script src="assets/js/all.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/dashbord.js"></script>
    <script src="assets/js/mainprogres.js"></script>
  </body>
</html>
